<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>
        <section
            <div class="row my-5">
                <div class="col-md-6 offset-md-3">
                    <div class="card">
                        <div class="card-header bg-medicare text-white text-center">
                            <h3><i class="fa-solid fa-calendar-check"></i> [[${titulo}]]</h3>
                        </div>
                        <div class="card-body text-center">
                            <p class="lead">[[${mensaje}]]</p>
                            <a th:href="@{/citasmedicas/listado}" class="btn btn-medicare-verde">
                                <i class="fas fa-arrow-left"></i> [[#{accion.regresar}]]
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
